name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    name: full test suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt

      - name: Install MPI + Eigen (for the C++ build + end-to-end tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin libeigen3-dev

      - name: Build SCRAPS
        env:
          MPICXX: mpic++
          EIGEN_INC: /usr/include/eigen3
        run: ./build.sh

      - name: Run full test suite (Python verifiers + end-to-end optimization)
        run: pytest tools/tests/ -v
