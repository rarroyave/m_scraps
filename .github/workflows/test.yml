name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: &test-paths
      - 'SCRAPs/**'
      - 'tools/**'
      - 'python/**'
      - 'tests/**'
      - 'scripts/**'
      - 'build.sh'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'
      - '!**/*.md'
      - '!**/*.rst'
  pull_request:
    branches: [main]
    paths: *test-paths
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run Linux/macOS on both supported Python versions
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Routine changes use one Linux job; release tags/manual audits use four.
      matrix: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.full_matrix)) && '{"os":["ubuntu-latest","macos-latest"],"python-version":["3.11","3.12"]}' || '{"os":["ubuntu-latest"],"python-version":["3.12"]}') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt

      - name: Install MPI + Eigen (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin libeigen3-dev

      - name: Install MPI + Eigen (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install open-mpi eigen

      - name: Build SCRAPS (Ubuntu)
        if: runner.os == 'Linux'
        env:
          MPICXX: /usr/bin/mpic++
          EIGEN_INC: /usr/include/eigen3
        run: ./build.sh

      - name: Build SCRAPS (macOS)
        if: runner.os == 'macOS'
        env:
          MPICXX: /opt/homebrew/bin/mpic++
          EIGEN_INC: /opt/homebrew/opt/eigen/include/eigen3
        run: ./build.sh

      - name: Run full test suite (Python verifiers + end-to-end optimization)
        env:
          # Correctness tests use up to four ranks on small hosted runners.
          OMPI_MCA_rmaps_base_oversubscribe: "1"
          PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
          MPIRUN: ${{ runner.os == 'macOS' && '/opt/homebrew/bin/mpirun' || 'mpirun' }}
        run: pytest tools/tests/ -v

      - name: Optional icet exporter tests
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
          PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
          MPIRUN: /usr/bin/mpirun
        run: |
          python -m pip install 'icet==4.0'
          pytest tools/tests/test_shared_species_export.py tools/tests/test_higher_order_export.py tools/tests/test_shared_species_api.py -v -rs
