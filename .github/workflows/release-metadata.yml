name: Release metadata
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cffconvert==2.0.0 PyYAML==6.0.3
      - name: Validate citation schema and release consistency
        run: |
          cffconvert --validate
          python scripts/check_release_metadata.py
          python -m unittest discover -s scripts -p 'test_release_metadata.py' -v
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release_metadata.py --tag "$RELEASE_TAG"
