name: Release metadata
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: &metadata-paths
      - 'CITATION.cff'
      - '.zenodo.json'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'python/m_scraps/__init__.py'
      - 'scripts/check_release_metadata.py'
      - 'scripts/test_release_metadata.py'
      - '.github/workflows/release-metadata.yml'
  pull_request:
    branches: [main]
    paths: *metadata-paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cffconvert==2.0.0 PyYAML==6.0.3
      - name: Validate citation schema and release consistency
        run: |
          cffconvert --validate
          python scripts/check_release_metadata.py
          python -m unittest discover -s scripts -p 'test_release_metadata.py' -v
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release_metadata.py --tag "$RELEASE_TAG"
