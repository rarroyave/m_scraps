name: ATAT-free reference benchmark

on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPICXX: /usr/bin/mpic++
      MPIRUN: /usr/bin/mpirun
      EIGEN_INC: /usr/include/eigen3
      OMPI_MCA_rmaps_base_oversubscribe: '1'
      PRTE_MCA_rmaps_default_mapping_policy: ':oversubscribe'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies (no ATAT or icet)
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin libeigen3-dev
          pip install -r tools/requirements.txt
      - name: Build native optimizer
        run: bash build.sh
      - name: Validate frozen ATAT references before benchmarking
        run: pytest tools/tests/test_atat_reference.py tools/tests/test_reference_benchmark.py tools/tests/test_figure_checkpoints.py tools/tests/test_submission_benchmark.py tools/tests/test_analysis_oracle.py tools/tests/test_structure_analysis.py -q
      - name: Short reproducible benchmark (CI performance is informational)
        run: python tools/benchmark_submission.py --output benchmark-results --seconds 5 --ranks 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 7
          name: atat-free-benchmark
          path: benchmark-results/
